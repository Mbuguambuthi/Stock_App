<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/Stock_App/Images/emirates.io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Images/emirates.io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Images/emirates.io/favicon-16x16.png">
    <link rel="manifest" href="/Images/emirates.io/site.webmanifest">
    <title>StockCalculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="Styles/styles.css">
    <script src="JavaScript/endwScript.js" defer></script>



</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    <header class="fw-bold  m-0 p-0">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a href="#" class="navbar-brand">
                    <img src="Images/Emirates_logo.jpeg" alt="Emirates_logo" class="navbrand flex-row logo">

                </a>

                <ul class="navbar-nav flex-row align-items-center">
                    <li class="nav-item dropdown dropstart mx-2 ">
                        <a class="nav-link dropdown-toggle text-black" aria-current="page" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">EWF</a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="index.html" class="dropdown-item disabled">Finished Goods</a>
                            </li>
                            <li>
                                <a href="index.html" class="dropdown-item">Returned Goods</a>
                            </li>

                        </ul>
                    </li>
                    <li class="nav-item mx-2 ">
                        <a class="nav-link active text-black" href="ENDW.html">ENDW</a>
                    </li>
                </ul>
            </div>
        </nav>
        <p class="text-center">Warehouse Stock Distribution Tracker</p>
    </header>
    <main class="container flex-fill d-flex  flex-column justify-content-center align-items-center">
        <div class="card">
            <div class="card-header fw-bold text-center fs-0 shadow-lg">
                Stock Distribution Form:
            </div>
            <div class="card-body bg-body">
                <form action="" id="distributionForm">
                    <div class="row mB-2">
                        <div class="col">
                            <label for="Driver" class="form-label fw-semibold"> Driver </label>
                            <Input class="form-control" id="endwDriver" data-bs-toggle="tooltip" data-placement="top"
                                title="Please Insert Driver Name" placeholder="Name" required></Input>
                            <ul class="list-group position-absolute" id="driverList"></ul>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="Routes" class="form-label fw-bold">Route:</label>
                            <select name="endwRouteSelect" title="endwRouteSelect" class="form-select"
                                id="endwRouteSelect">
                                <option value="text">--- ENDW Routes ---</option>
                            </select>
                        </div>

                        <div class="col">
                            <label for="endwTrip" class="form-label fw-semibold"> Trip</label>
                            <select name="endwTrip" id="endwTripSelect" class="form-select" title="endwTripSelect"
                                required>
                                <option value="">--Select Trip---</option>
                            </select>

                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="loadOut" class="form-label fw-semibold">#LoadOut No</label>
                            <input type="number" class="form-control text-center fw-semibold" min="0" value="0"
                                id="loadOut" required>
                        </div>
                    </div>

                    <div class="row mb-3">

                        <div class="col">
                            <label for="endwBrands" class="form-label fw-semibold"> Brands</label>
                            <input type="text" class="form-control" id="brand" placeholder="Emirates / Hilton"
                                data-bs-toggle="tooltip" data-bs-placement="bottom"
                                title="Write the logo name of the item issued" required>
                        </div>

                        <ul class="list-group position-absolute" id="brandList"></ul>


                    </div>

                    <div class="row mb-3">
                        <div class="col-5 ">
                            <label for="items" class="form-label fw-semibold">Items</label>
                            <select name="endwItemSelect" class="form-select" id="endwItemSelect"
                                title="endwItemSelect">

                                <option value="">--- ENDW Items ---</option>
                            </select>
                        </div>
                        <div class="col-3">
                            <label for="Qty" class="form-label fw-semibold">Quantity</label>

                            <input type="number" class="form-control text-center" id="endwItemsQty" title="endwItemsQty"
                                value="0" min="0" required>
                        </div>
                        <div class="col-2 d-flex align-items-end">
                            <button class="btn btn-success w-100" id="addItemBtn" type="button">+Add</button>
                        </div>
                    </div>
                    <table class="table table-sm table-bordered">
                        <thead class="table-light">
                            <th>Item</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-center">Action</th>
                        </thead>
                        <tbody id="itemsTableBody"></tbody>
                    </table>


                    <div class="row mb-3">
                        <div class="col">
                            <label for="action" class="form-label fw-semibold">
                                Action
                            </label>
                            <select name="actionSelect" id="actionSelect" class="form-select" title="actionSelect">
                                <option value="IN" class="form-control fw-semibold" id="actionIN">
                                    IN
                                </option>
                                <option value="OUT" class="form-control fw-semibold" id="actionOUT">
                                    OUT
                                </option>
                                <option value="RETURN" class="form-control fw-semibold" id="actionReturn">
                                    RETURN
                                </option>
                                <option value="DAMAGE" class="form-control fw-semibold" id="actionDamage">
                                    DAMAGE
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="user" class="form-label fw-semibold">
                                Entered By
                            </label>
                            <input type="text" class="form-control" id="user" placeholder="Name / Designation"
                                data-bs-toggle="tooltip" data-bs-placement="bottom"
                                title="Write your Name / Designation" required>
                        </div>
                    </div>
                </form>

            </div>
            <div class="card-footer d-flex flex-row justify-content-center">
                <button class="btn btn-info btn-sm me-2" type="button"> Signature</button>
                <button class="btn btn-primary btn-lg me-2" type="submit">Submit</button>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-2">
        &copy; 2026 ENDW & EWF
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">

    </script>

    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        const tooltipList = [...tooltipTriggerList].map(
            tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl)
        );
    </script>


</body>

</html>
