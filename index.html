<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/Stock_App/Images/emirates.io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Images/emirates.io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Images/emirates.io/favicon-16x16.png">
    <link rel="manifest" href="/Images/emirates.io/site.webmanifest">
    <title> Emirates Natural Drinking Water & Emirates Water Factory LLC. StoreKeeper Stock App Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="Styles/styles.css">
    <script src="JavaScript/Script.js" defer></script>

</head>

<body class="d-flex flex-column bg-body-primary min-vh-100 min-vw-100">
    <header class="fw-bold m-0 p-0">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a href="#" class="navbar-brand">
                    <img src="Images/Emirates_logo.jpeg" alt="Emirates_logo" class="navbrand flex-row logo">

                </a>

                <ul class="navbar-nav flex-row align-items-center">
                    <li class="nav-item dropdown dropstart mx-2 ">
                        <a class="nav-link acrive dropdown-toggle text-black" aria-current="page" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">EWF</a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="ewfFinishedGoods.min.html" class="dropdown-item">Finished Goods</a>
                            </li>
                            <li>
                                <a href="index.min.html" class="dropdown-item">Returned Goods</a>
                            </li>

                        </ul>
                    </li>
                    <li class="nav-item mx-2 ">
                        <a class="nav-link text-black" href="ENDW.min.html">ENDW</a>
                    </li>
                </ul>
            </div>
        </nav>
        <p class="text-center">Warehouse Stock Distribution Tracker</p>
    </header>
    <main class="container flex-fill d-flex justify-content-center align-items-center">
        <div class="card  shadow-lg mx-2">
            <div class="card-header">
                <p class="fw-bold text-center">
                    Stock Return Form:
                </p>
            </div>
            <div class="card-body">
                <form action="" id="deliveryForm">

                    <div class="row mb-3">
                        <div class="col">
                            <label for="Driver Name" class="form-label fw-semibold">Driver Name:</label>
                            <input type="text" class="form-control" id="driverName" placeholder="Driver Name"
                                list="driver" autocomplete="on">
                            <datalist id="driver">
                                <option value="Srinavas"></option>
                                <option value="Zafar Abbas"></option>
                                <option value="Monirul Islam"></option>
                                <option value="Ahsan Zafar"></option>
                                <option value="Naveed Imran"></option>
                                <option value="Mujahid"></option>
                                <option value="Naveed Ahmad"></option>
                                <option value="Kashif"></option>
                                <option value="Niamith Ali"></option>
                                <option value="Guwan Kumar"></option>
                                <option value="Rony"></option>
                                <option value="Muhammad Zahid"></option>
                                <option value="Zahid"></option>
                                <option value="Sajawal Abbas"></option>
                                <option value="Pandey Kumar"></option>
                                <option value="Sulatania"></option>
                                <option value="Zohaib Hassan"></option>
                                <option value="Hassan Zeb"></option>
                                <option value="Hamid ALi"></option>
                                <option value="Shahabull"></option>
                                <option value="Afaq"></option>
                                <option value="Awais Ali"></option>
                                <option value="Fahad"></option>
                                <option value="Shakeel Khan"></option>
                                <option value="Dilnawaz Khan"></option>
                                <option value="Sakir"></option>
                            </datalist>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="Route" class="form-label fw-semibold">Route:</label>
                            <select name="Routes" title="Routes" class="form-select" id="routeSelect" required>
                                <option value="">--Select Route--</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="Trip" class="form-label fw-semibold">Trip:</label>

                            <select name="Trips" title="Trips" class="form-select" id="tripSelect" required>
                                <option value="">--Select Trip--</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-5">
                            <label for="Items" class="form-label fw-semibold">Items:</label>
                            <select name="itemSelect" id="itemSelect" class="form-select" title="itemFormSelect">
                                <option value="">---EWF Return Items ---</option>
                            </select>
                        </div>
                        <div class="col-3">
                            <label for="Quantity" class="form-label fw-semibold">Quantity</label>
                            <input type="number" class="form-control text-center" id="ewfItemsQty" value="0" min="o"
                                title="ewfItemsQty" required>
                        </div>
                        <div class="col-2 d-flex align-items-end text-center">
                            <button class="btn btn-success vw-50  text-light" id="addItemBtn" type="button">
                                +
                            </button>
                        </div>
                    </div>
                    <table class="table table-sm table-bordered">
                        <thead class="table-light">
                            <th>Item</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-center">Action</th>
                        </thead>
                        <tbody id="itemsTableBody"></tbody>
                    </table>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="Action" class="fotm-label fw-semibold" data-bs-toggle="tooltip"
                                data-bs-placement="top"
                                title="Select Action 'IN' for all returned items">Action:</label>
                            <select name="Action" id="action" class="form-select" title="action" required>
                                <option value="IN">IN</option>
                                <option value="OUT">OUT</option>

                            </select>

                        </div>

                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="user" class="form-label fw-semibold">Entered By:</label>
                            <input type="text" class="form-control" id="user" placeholder="Store Keeper/Security"
                                data-bs-toggle="tooltip" data-bs-placement="top" title="Enter your Name / Designation">
                        </div>

                    </div>
                    <div class="card-footer text-center">
                        <button class="btn btn-primary btn-lg" type="submit">
                            Submit
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>
    <footer class="text-center text-black bg-body-tertiary p-2">

        <p class="fw-bold">&copy; 2026 ENDW & EWF</p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">

    </script>
    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        const tooltipList = [...tooltipTriggerList].map(
            tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl)
        );
    </script>

</body>

</html>
