<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Tracker App logins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="JavaScript/auth.js" defer></script>


</head>

<body class="d-flex flex-column bg-body min-vh-100 min-vw-100">
    <main class="container flex-fill d-flex justify-content-center align-items-center  bg-body-tertiary">

        <div class="row">
            <div class="card bg-body-secondary shadow">
                <div class="card-header">
                    <p class="fw-bold text-center">SignUp or LogIn:</p>
                </div>
                <div class="card-body">
                    <label for="Email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Bryanmbugua885@gmail.com">
                    <label for="Password" class="form-labl">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="XXX123">

                    <p id="status"></p>

                    <div class="card-footer d-flex align-items-center flex-column justify-content-center">
                        <div class="col mt-3">
                            <button id="login" class="btn btn-md btn-primary">Login</button>
                        </div>
                        <div class="col mt-3">
                            <button id="signup" class="btn btn-sm btn-success">Create Account</button>
                        </div>
                        <p class="text-bold mt-2">OR
                        </p>
                        <div class="col">
                            <button id="googleLogin" class="btn btn-sm btn-info">Login with Google</button>

                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
